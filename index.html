<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>The Fair Share Calculator™</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600;700&family=Outfit:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet"/>
<style>
:root{--bg:#111110;--bgAlt:#181816;--surface:#1E1E1C;--raised:#2A2A27;--border:#333330;--borderGold:#8B7535;--text:#F0EDE5;--textSec:#A09C90;--textMut:#706C60;--gold:#C9A84C;--goldDk:#8B7535;--goldLt:#D4B85E;--goldBg:rgba(201,168,76,0.08);--green:#5BAD78;--greenBg:rgba(91,173,120,0.1);--blue:#6B9BD2;--blueBg:rgba(107,155,210,0.1);--orange:#D4956A;--red:#D4716A;--redBg:rgba(212,113,106,0.1);--cream:#F5F0E3;--shadow:0 2px 8px rgba(0,0,0,0.3);--shadowGold:0 0 20px rgba(201,168,76,0.15)}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);font-family:'Outfit',sans-serif;color:var(--text);-webkit-font-smoothing:antialiased;line-height:1.5}
input[type=text],input[type=number]{background:var(--surface);border:1.5px solid var(--border);border-radius:8px;color:var(--text);font-family:'JetBrains Mono';font-size:14px;font-weight:500;padding:10px 12px;outline:none;transition:all .2s;width:100%}
input:focus{border-color:var(--gold);box-shadow:0 0 0 3px var(--goldBg)}
input[type=range]{-webkit-appearance:none;height:4px;background:var(--border);border-radius:2px;outline:none;cursor:pointer;width:120px}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:18px;height:18px;border-radius:50%;background:var(--gold);cursor:pointer;box-shadow:var(--shadowGold)}
.wrap{max-width:960px;margin:0 auto;padding:0 20px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:24px;box-shadow:var(--shadow);margin-bottom:16px}
.card.glow{border-color:var(--borderGold);box-shadow:var(--shadowGold)}
.section-label{margin-bottom:18px}
.section-label h3{font-family:'Playfair Display';font-size:20px;font-weight:500;display:flex;align-items:center;gap:10px}
.section-label p{font-size:13px;color:var(--textMut);margin-top:4px;margin-left:30px}
.input-row{display:flex;align-items:center;justify-content:space-between;padding:8px 0;gap:12px}
.input-row label{flex:1;font-size:14px;color:var(--textSec)}
.input-row .hint{font-size:11px;color:var(--textMut);display:block;margin-top:1px}
.input-row .fields{display:flex;gap:8px}
.input-row .fields .field{width:130px;position:relative}
.input-row .fields .field.single{width:140px}
.field-prefix{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--textMut);font-family:'JetBrains Mono';font-size:13px;pointer-events:none}
.field-suffix{position:absolute;right:10px;top:50%;transform:translateY(-50%);color:var(--textMut);font-family:'JetBrains Mono';font-size:13px;pointer-events:none}
.field input.currency{padding-left:24px}
.field input.percent{padding-right:24px;text-align:right}
.divider{height:1px;background:var(--border);margin:4px 0}
.total-row{display:flex;justify-content:space-between;align-items:center;padding-top:14px;border-top:2px solid var(--border);margin-top:6px}
.total-row .val{font-family:'JetBrains Mono';font-size:15px;font-weight:600}
.partner-labels{display:flex;justify-content:flex-end;gap:8px;margin-bottom:10px}
.partner-labels span{width:130px;text-align:center;font-size:12px;font-weight:600}
.partner-labels .a{color:var(--gold)}.partner-labels .b{color:var(--blue)}
.tabs{display:flex;border-bottom:1px solid var(--border);background:var(--surface);position:sticky;top:0;z-index:10}
.tabs button{padding:13px 20px;border:none;cursor:pointer;background:transparent;font-family:'Outfit';font-size:14px;color:var(--textMut);border-bottom:2px solid transparent;transition:all .2s;display:flex;align-items:center;gap:7px}
.tabs button.active{color:var(--gold);border-bottom-color:var(--gold);font-weight:600}
.stat-cards{display:flex;gap:12px;margin-bottom:16px;flex-wrap:wrap}
.stat-card{flex:1;min-width:140px;padding:16px 18px;background:var(--surface);border-radius:12px;border:1px solid var(--border);border-left:3px solid var(--gold)}
.stat-card .lbl{font-size:11px;color:var(--textMut);text-transform:uppercase;letter-spacing:1px;margin-bottom:6px}
.stat-card .val{font-family:'JetBrains Mono';font-size:20px;font-weight:600}
.stat-card .sub{font-size:12px;color:var(--textMut);margin-top:4px}
.model-toggle{display:flex;gap:6px;background:var(--bgAlt);border-radius:12px;padding:5px;border:1px solid var(--border)}
.model-toggle button{flex:1;padding:10px 12px;border-radius:9px;border:1px solid transparent;cursor:pointer;background:transparent;color:var(--textMut);font-family:'Outfit';font-size:13px;transition:all .25s;display:flex;align-items:center;justify-content:center;gap:6px}
.model-toggle button.active{font-weight:600}
.pocket-cards{display:flex;gap:16px;margin-top:0}
.pocket-card{flex:1;padding:20px;border-radius:12px;text-align:center}
.pocket-card .name{font-size:13px;font-weight:600;margin-bottom:8px}
.pocket-card .amount{font-family:'JetBrains Mono';font-size:28px;font-weight:600}
.pocket-card .sub{font-size:12px;color:var(--textMut);margin-top:6px}
.bar-chart{display:flex;align-items:flex-end;gap:8px;height:200px;padding:0 10px}
.bar-group{flex:1;display:flex;gap:4px;align-items:flex-end;justify-content:center}
.bar{border-radius:6px 6px 0 0;min-width:28px;transition:height .5s ease}
.bar-label{text-align:center;font-size:11px;color:var(--textMut);margin-top:6px}
.bar-val{text-align:center;font-family:'JetBrains Mono';font-size:11px;margin-bottom:4px;font-weight:500}
.chart-legend{display:flex;gap:16px;justify-content:center;margin-top:12px}
.chart-legend span{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--textSec)}
.chart-legend .dot{width:12px;height:12px;border-radius:3px}
.donut-wrap{display:flex;align-items:center;justify-content:center;gap:30px;padding:10px 0}
.pain-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
.pain-card{padding:16px;border-radius:12px;text-align:center}
.pain-card .title{font-size:12px;font-weight:600;margin-bottom:12px}
.pain-card .vals{display:flex;justify-content:space-around}
.pain-card .vals div{text-align:center}
.pain-card .vals .lbl{font-size:11px;color:var(--textMut)}
.pain-card .vals .num{font-family:'JetBrains Mono';font-size:18px;font-weight:600;margin-top:2px}
.pain-card .spread{font-size:11px;color:var(--textMut);margin-top:10px;padding-top:10px}
.hero-box{background:linear-gradient(160deg,#1A1A18,#252520 40%,#1E1D18);border-radius:16px;padding:40px 30px;text-align:center;border:1px solid var(--borderGold);box-shadow:var(--shadowGold);position:relative;overflow:hidden}
.hero-box::before{content:'';position:absolute;inset:0;background:radial-gradient(ellipse at 50% 0%,rgba(201,168,76,0.1) 0%,transparent 70%);pointer-events:none}
.hero-box .big{font-family:'Playfair Display';font-size:48px;color:var(--gold);letter-spacing:-2px;position:relative;text-shadow:0 0 40px rgba(201,168,76,0.3)}
.hero-stats{display:flex;justify-content:center;gap:36px;margin-top:16px;position:relative}
.hero-stats .stat .lbl{font-size:11px;color:var(--textMut);text-transform:uppercase;letter-spacing:1px}
.hero-stats .stat .num{font-family:'JetBrains Mono';font-size:18px;font-weight:600;margin-top:2px}
.habit-row{display:flex;align-items:center;gap:14px;padding:13px 16px;background:var(--bgAlt);border-radius:10px;border:1px solid var(--border);margin-bottom:8px}
.habit-row .emoji{font-size:22px;min-width:32px;text-align:center}
.habit-row .info{flex:1}
.habit-row .info .top{display:flex;justify-content:space-between;margin-bottom:6px}
.habit-row .info .top .name{font-size:14px;color:var(--textSec)}
.habit-row .info .top .cost{font-family:'JetBrains Mono';font-size:12px;color:var(--textMut)}
.habit-row .progress{height:5px;background:var(--border);border-radius:3px;overflow:hidden}
.habit-row .progress .fill{height:100%;border-radius:3px;background:linear-gradient(90deg,var(--goldDk),var(--gold));transition:width .8s ease}
.habit-row .future{text-align:right;min-width:95px}
.habit-row .future .val{font-family:'JetBrains Mono';font-size:16px;font-weight:600;color:var(--gold)}
.habit-row .future .yr{font-size:10px;color:var(--textMut)}
.reframe{background:linear-gradient(135deg,var(--surface),#1A1916);border-radius:14px;padding:28px;border:1px solid var(--borderGold);box-shadow:var(--shadowGold);display:flex;gap:16px;margin-bottom:16px}
.reframe h3{font-family:'Playfair Display';font-size:19px;color:var(--cream);margin-bottom:10px}
.reframe p{font-size:14px;color:var(--textSec);line-height:1.8}
.gold-tip{padding:14px 18px;background:var(--goldBg);border-radius:10px;border:1px solid rgba(201,168,76,0.15);font-size:13px;color:var(--gold);line-height:1.6;margin-top:14px}
.cta-btn{width:100%;padding:16px;border:none;border-radius:12px;cursor:pointer;background:linear-gradient(135deg,var(--gold),var(--goldDk));color:var(--bg);font-family:'Outfit';font-size:16px;font-weight:600;letter-spacing:.5px;box-shadow:var(--shadowGold);margin-bottom:16px}
.header{border-bottom:1px solid var(--border);background:var(--surface);padding:20px 0}
.header .inner{display:flex;align-items:center;justify-content:space-between}
.header .logo{display:flex;align-items:center;gap:12px}
.header .logo .icon{width:36px;height:36px;border-radius:10px;background:linear-gradient(135deg,var(--gold),var(--goldDk));display:flex;align-items:center;justify-content:center;font-size:18px;box-shadow:var(--shadowGold)}
.header h1{font-family:'Playfair Display';font-size:24px;color:var(--cream);font-weight:500}
.header .sub{font-size:13px;color:var(--textMut);margin-top:3px;margin-left:48px}
.badge{padding:6px 14px;background:var(--goldBg);border-radius:20px;border:1px solid var(--goldDk);font-size:11px;color:var(--gold);font-weight:600;letter-spacing:1.2px;text-transform:uppercase}
.footer{border-top:1px solid var(--border);padding:20px;text-align:center;background:var(--surface);font-size:12px;color:var(--textMut);margin-top:30px}
.footer .disclaimer{font-size:11px;opacity:.6;margin-top:4px}
.tab-content{padding:24px 0}
.hidden{display:none}
.flex-row{display:flex;gap:16px}.flex-row>.card{flex:1}
@media(max-width:700px){.stat-cards{flex-direction:column}.pain-grid{grid-template-columns:1fr}.flex-row{flex-direction:column}.partner-labels span,.input-row .fields .field{width:100px}.header h1{font-size:18px}.hero-box .big{font-size:36px}.badge{display:none}}
</style>
</head>
<body>

<div class="header"><div class="wrap inner">
  <div><div class="logo"><div class="icon">⚖️</div><h1>The Fair Share Calculator</h1></div><p class="sub">Three fairness models. One honest conversation.</p></div>
  <div class="badge">CFA® L3 Candidate</div>
</div></div>

<div class="wrap"><div class="tabs" id="tabs">
  <button class="active" data-tab="input">📋 Data Entry</button>
  <button data-tab="dashboard">📊 Dashboard</button>
  <button data-tab="wealth">🚀 Wealth Multiplier</button>
</div></div>

<div class="wrap"><div class="tab-content" id="content"></div></div>

<div class="footer"><p>The Fair Share Calculator™ — Built by a CFA® Level III Candidate</p><p class="disclaimer">For educational purposes only. CFA® is a registered trademark of CFA Institute.</p></div>

<script>
const $=s=>document.querySelector(s),$$=s=>document.querySelectorAll(s);
const fmt=n=>{if(n==null||isNaN(n))return"$0";return n<0?"-$"+Math.abs(Math.round(n)).toLocaleString():"$"+Math.round(n).toLocaleString()};
const pct=n=>(n*100).toFixed(1)+"%";

let state={pA:"Partner A",pB:"Partner B",sA:120000,sB:65000,bA:15000,bB:5000,siA:0,siB:0,dA:450,dB:280,dA2:350,dB2:75,rent:2800,util:350,groc:800,ins:600,trans:400,din:500,subs:150,sav:500,oth:200,tA:.30,tB:.22,ir:.07,iy:20,ms:200};
let tab="input",model="proportional";

function calc(){
  const s=state,gA=s.sA+s.bA+s.siA,gB=s.sB+s.bB+s.siB,nA=gA*(1-s.tA),nB=gB*(1-s.tB),tN=nA+nB;
  const mdA=s.dA+s.dA2,mdB=s.dB+s.dB2,dA=nA-mdA*12,dB=nB-mdB*12;
  const mE=s.rent+s.util+s.groc+s.ins+s.trans+s.din+s.subs+s.sav+s.oth;
  const pA=tN>0?nA/tN:.5,pmA=mE*pA,pmB=mE*(1-pA);
  const fun=(tN/12-mE)/2,amA=nA/12-fun,amB=nB/12-fun;
  const aA=Math.max(0,nA-mdA*12),aB=Math.max(0,nB-mdB*12),aT=aA+aB;
  const dsA=aT>0?aA/aT:.5,dmA=mE*dsA,dmB=mE*(1-dsA);
  const r=s.ir/12,n=s.iy*12,fv=s.ms*((Math.pow(1+r,n)-1)/(r||.001)),tc=s.ms*n;
  return{gA,gB,nA,nB,tN,mdA,mdB,dA,dB,mE,pA,pmA,pmB,fun,amA,amB,dsA,dmA,dmB,fv,tc};
}

function getAR(c){
  if(model==="proportional")return{sA:c.pA,sB:1-c.pA,mA:c.pmA,mB:c.pmB,rA:c.nA/12-c.pmA,rB:c.nB/12-c.pmB};
  if(model==="allowance")return{sA:c.mE>0?c.amA/c.mE:.5,sB:c.mE>0?c.amB/c.mE:.5,mA:c.amA,mB:c.amB,rA:c.fun,rB:c.fun};
  return{sA:c.dsA,sB:1-c.dsA,mA:c.dmA,mB:c.dmB,rA:c.nA/12-c.mdA-c.dmA,rB:c.nB/12-c.mdB-c.dmB};
}

function inp(id,val,cls,ph){
  return`<div class="field${cls==='single'?' single':''}"><span class="field-prefix">$</span><input type="text" inputmode="numeric" class="currency" data-key="${id}" value="${Math.round(val).toLocaleString()}" placeholder="${ph||''}"></div>`;
}
function pctInp(id,val){
  return`<div class="field"><input type="text" inputmode="decimal" class="percent" data-key="${id}" data-pct="1" value="${(val*100).toFixed(1)}"><span class="field-suffix">%</span></div>`;
}
function nameInp(id,val,color){
  return`<input type="text" data-key="${id}" data-name="1" value="${val}" style="color:${color};font-family:Outfit;font-weight:500;font-size:15px;padding:11px 14px">`;
}

function donut(shareA,shareB,size){
  size=size||160;const r=size/2-8,cx=size/2,cy=size/2,circ=2*Math.PI*r;
  const a1=Math.max(0,Math.min(1,shareA)),a2=1-a1;
  const d1=circ*a1,d2=circ*a2,gap=4;
  return`<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}"><circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="var(--gold)" stroke-width="16" stroke-dasharray="${d1-gap} ${circ}" stroke-dashoffset="${circ/4}" stroke-linecap="round"/><circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="var(--blue)" stroke-width="16" stroke-dasharray="${d2-gap} ${circ}" stroke-dashoffset="${circ/4-d1}" stroke-linecap="round"/></svg>`;
}

function barChart(data,maxVal){
  if(!maxVal)maxVal=Math.max(...data.flatMap(d=>[d.a,d.b]),1);
  const h=180;
  return`<div style="margin:10px 0"><div class="bar-chart" style="height:${h}px">${data.map(d=>{
    const hA=Math.max(4,(d.a/maxVal)*h),hB=Math.max(4,(d.b/maxVal)*h);
    return`<div style="flex:1;text-align:center"><div style="display:flex;gap:4px;align-items:flex-end;justify-content:center;height:${h}px"><div><div class="bar-val" style="color:var(--gold)">${fmt(d.a)}</div><div class="bar" style="height:${hA}px;width:32px;background:var(--gold)"></div></div><div><div class="bar-val" style="color:var(--blue)">${fmt(d.b)}</div><div class="bar" style="height:${hB}px;width:32px;background:var(--blue)"></div></div></div><div class="bar-label">${d.name}</div></div>`;
  }).join("")}</div><div class="chart-legend"><span><span class="dot" style="background:var(--gold)"></span>${state.pA}</span><span><span class="dot" style="background:var(--blue)"></span>${state.pB}</span></div></div>`;
}

function render(){
  const c=calc(),ar=getAR(c),s=state;
  let html="";

  if(tab==="input"){
    html+=`<div class="card"><div class="section-label"><h3>👥 Who's at the Table?</h3><p>Names make the numbers personal.</p></div><div style="display:flex;gap:16px">${nameInp("pA",s.pA,"var(--gold)")}${nameInp("pB",s.pB,"var(--blue)")}</div></div>`;

    html+=`<div class="card"><div class="section-label"><h3>💰 Annual Income</h3><p>Gross income before taxes.</p></div><div class="partner-labels"><span class="a">${s.pA}</span><span class="b">${s.pB}</span></div>`;
    [["Salary","sA","sB"],["Bonus / Variable","bA","bB"],["Side Hustle","siA","siB"]].forEach(([l,a,b])=>{
      html+=`<div class="input-row"><label>${l}</label><div class="fields">${inp(a,s[a])}${inp(b,s[b])}</div></div><div class="divider"></div>`;
    });
    html+=`<div class="total-row"><span style="font-weight:600">Total Gross</span><div style="display:flex;gap:8px"><span class="val" style="width:130px;text-align:center;color:var(--gold)">${fmt(c.gA)}</span><span class="val" style="width:130px;text-align:center;color:var(--blue)">${fmt(c.gB)}</span></div></div></div>`;

    html+=`<div class="card"><div class="section-label"><h3>🏛️ Effective Tax Rates</h3><p>Combined federal + state + FICA.</p></div><div class="partner-labels"><span class="a">${s.pA}</span><span class="b">${s.pB}</span></div><div class="input-row"><label>All-in Effective Rate<span class="hint">Federal + State + FICA</span></label><div class="fields">${pctInp("tA",s.tA)}${pctInp("tB",s.tB)}</div></div><div class="total-row"><span style="font-weight:600">After-Tax Income</span><div style="display:flex;gap:8px"><span class="val" style="width:130px;text-align:center;color:var(--green)">${fmt(c.nA)}</span><span class="val" style="width:130px;text-align:center;color:var(--green)">${fmt(c.nB)}</span></div></div></div>`;

    html+=`<div class="card"><div class="section-label"><h3>⚡ The Drama Column — Individual Debts</h3><p>Monthly obligations each person carries solo.</p></div><div class="partner-labels"><span class="a">${s.pA}</span><span class="b">${s.pB}</span></div>`;
    [["Student Loans /mo","dA","dB"],["Car / Credit / Other /mo","dA2","dB2"]].forEach(([l,a,b])=>{
      html+=`<div class="input-row"><label>${l}</label><div class="fields">${inp(a,s[a])}${inp(b,s[b])}</div></div><div class="divider"></div>`;
    });
    html+=`</div>`;

    html+=`<div class="card"><div class="section-label"><h3>🏠 Joint Expenses</h3><p>Monthly shared costs.</p></div>`;
    [["Rent / Mortgage","rent"],["Utilities & Internet","util"],["Groceries","groc"],["Insurance","ins"],["Transportation","trans"],["Dining & Entertainment","din"],["Subscriptions","subs"],["Joint Savings","sav"],["Other","oth"]].forEach(([l,k])=>{
      html+=`<div class="input-row"><label>${l}</label><div class="fields">${inp(k,s[k],"single")}</div></div><div class="divider"></div>`;
    });
    html+=`<div class="total-row"><span style="font-weight:600">Total Monthly Shared</span><span class="val" style="color:var(--gold);font-size:20px">${fmt(c.mE)}<span style="font-size:12px;color:var(--textMut);font-weight:400">/mo</span></span></div></div>`;

    html+=`<button class="cta-btn" onclick="tab='dashboard';render();$$('.tabs button').forEach(b=>b.classList.toggle('active',b.dataset.tab==='dashboard'))">See Your Results →</button>`;
  }

  if(tab==="dashboard"){
    const models={proportional:{primary:"var(--green)",bg:"rgba(91,173,120,0.08)",mid:"rgba(91,173,120,0.2)",label:"Proportional",icon:"⚖️",desc:`<strong>The Proportional:</strong> Each partner contributes based on their share of after-tax income.`},allowance:{primary:"var(--blue)",bg:"rgba(107,155,210,0.08)",mid:"rgba(107,155,210,0.2)",label:"Equal Allowance",icon:"🎯",desc:`<strong>The Equal Allowance:</strong> Both end up with identical personal spending money.`},debtAdjusted:{primary:"var(--orange)",bg:"rgba(212,149,106,0.08)",mid:"rgba(212,149,106,0.2)",label:"Debt-Adjusted",icon:"🛡️",desc:`<strong>The Debt-Adjusted:</strong> Subtracts individual debts before calculating shares.`}};
    const m=models[model];

    html+=`<div class="card glow"><div class="section-label"><h3>🔀 Choose Your Fairness Model</h3><p>Toggle to see your split change in real-time.</p></div><div class="model-toggle">${Object.entries(models).map(([k,v])=>`<button class="${model===k?'active':''}" data-model="${k}" style="${model===k?`background:${v.bg};border-color:${v.mid};color:${v.primary}`:''}">${v.icon} ${v.label}</button>`).join("")}</div><div style="margin-top:16px;padding:16px;background:${m.bg};border-radius:10px;border:1px solid ${m.mid};font-size:14px;color:${m.primary};line-height:1.7">${m.desc}</div></div>`;

    html+=`<div class="stat-cards"><div class="stat-card"><div class="lbl">✦ ${s.pA} pays</div><div class="val" style="color:var(--gold)">${fmt(ar.mA)}/mo</div><div class="sub">${pct(ar.sA)} of expenses</div></div><div class="stat-card" style="border-left-color:var(--blue)"><div class="lbl">✦ ${s.pB} pays</div><div class="val" style="color:var(--blue)">${fmt(ar.mB)}/mo</div><div class="sub">${pct(ar.sB)} of expenses</div></div><div class="stat-card" style="border-left-color:var(--textSec)"><div class="lbl">🏠 Total Shared</div><div class="val" style="color:var(--textSec)">${fmt(c.mE)}/mo</div><div class="sub">${fmt(c.mE*12)}/year</div></div></div>`;

    html+=`<div class="card"><div class="section-label"><h3>💰 What Stays In Your Pocket</h3></div><div class="pocket-cards">${[[s.pA,ar.rA,"var(--gold)"],[s.pB,ar.rB,"var(--blue)"]].map(([n,v,clr])=>`<div class="pocket-card" style="background:${v>=0?'var(--greenBg)':'var(--redBg)'};border:1px solid ${v>=0?'rgba(91,173,120,0.2)':'rgba(212,113,106,0.2)'}"><div class="name" style="color:${clr}">${n}</div><div class="amount" style="color:var(--${v>=0?'green':'red'})">${fmt(v)}</div><div class="sub">per month remaining</div></div>`).join("")}</div></div>`;

    html+=`<div style="display:flex;gap:16px;flex-wrap:wrap"><div class="card" style="flex:1;min-width:200px"><div class="section-label"><h3>🍩 Split</h3></div><div class="donut-wrap">${donut(ar.sA,ar.sB)}<div>${[[s.pA,pct(ar.sA),"var(--gold)"],[s.pB,pct(ar.sB),"var(--blue)"]].map(([n,sh,clr])=>`<div style="display:flex;align-items:center;gap:8px;margin-bottom:8px"><div style="width:12px;height:12px;border-radius:3px;background:${clr}"></div><span style="font-size:13px;color:var(--textSec)">${n}</span><span style="font-family:JetBrains Mono;font-size:14px;font-weight:600;color:${clr}">${sh}</span></div>`).join("")}</div></div></div><div class="card" style="flex:2;min-width:280px"><div class="section-label"><h3>📊 All Three Models</h3></div>${barChart([{name:"Proportional",a:c.pmA,b:c.pmB},{name:"Equal Allow.",a:c.amA,b:c.amB},{name:"Debt-Adj.",a:c.dmA,b:c.dmB}])}</div></div>`;

    const pi=[{label:"Proportional",primary:"var(--green)",bg:"rgba(91,173,120,0.08)",mid:"rgba(91,173,120,0.2)",pA:c.dA>0?(c.pmA*12)/c.dA:0,pB:c.dB>0?(c.pmB*12)/c.dB:0},{label:"Equal Allowance",primary:"var(--blue)",bg:"rgba(107,155,210,0.08)",mid:"rgba(107,155,210,0.2)",pA:c.dA>0?(c.amA*12)/c.dA:0,pB:c.dB>0?(c.amB*12)/c.dB:0},{label:"Debt-Adjusted",primary:"var(--orange)",bg:"rgba(212,149,106,0.08)",mid:"rgba(212,149,106,0.2)",pA:c.dA>0?(c.dmA*12)/c.dA:0,pB:c.dB>0?(c.dmB*12)/c.dB:0}];
    html+=`<div class="card"><div class="section-label"><h3>🌡️ Pain Index</h3><p>% of disposable income to shared costs. Lower spread = more equitable.</p></div><div class="pain-grid">${pi.map(m=>`<div class="pain-card" style="background:${m.bg};border:1px solid ${m.mid}"><div class="title" style="color:${m.primary}">${m.label}</div><div class="vals"><div><div class="lbl">${s.pA}</div><div class="num" style="color:${m.primary}">${pct(m.pA)}</div></div><div><div class="lbl">${s.pB}</div><div class="num" style="color:${m.primary}">${pct(m.pB)}</div></div></div><div class="spread" style="border-top:1px solid ${m.mid}">Spread: <strong style="color:var(--${Math.abs(m.pA-m.pB)>.2?'red':'green'})">${pct(Math.abs(m.pA-m.pB))}</strong></div></div>`).join("")}</div><p style="font-size:12px;color:var(--textMut);margin-top:14px;font-style:italic">⚠️ A spread over 20% signals structural inequity.</p></div>`;
  }

  if(tab==="wealth"){
    const c2=calc(),r2=s.ir/12,n2=s.iy*12,mult=r2>0?(Math.pow(1+r2,n2)-1)/r2:n2;

    html+=`<div class="hero-box"><p style="font-size:15px;color:var(--textMut);margin-bottom:12px;position:relative">Invest <strong style="color:var(--gold)">${fmt(s.ms)}/month</strong> at ${pct(s.ir)} for ${s.iy} years</p><div class="big" id="heroNum">${fmt(c2.fv)}</div><div class="hero-stats"><div class="stat"><div class="lbl">You put in</div><div class="num" style="color:var(--blue)">${fmt(c2.tc)}</div></div><div style="width:1px;background:var(--border)"></div><div class="stat"><div class="lbl">Market gives you</div><div class="num" style="color:var(--green)">${fmt(c2.fv-c2.tc)}</div></div></div></div>`;

    html+=`<div class="card"><div class="section-label"><h3>⚙️ Adjust Your Scenario</h3></div><div class="input-row"><label>Monthly Savings<span class="hint">How much could you redirect?</span></label><div class="fields">${inp("ms",s.ms,"single")}</div></div><div class="divider"></div><div class="input-row"><label>Annual Return<span class="hint">S&P 500 ≈ 10% · Conservative ≈ 7%</span></label><div class="fields">${pctInp("ir",s.ir)}</div></div><div class="divider"></div><div class="input-row"><label>Time Horizon</label><div style="display:flex;align-items:center;gap:14px"><input type="range" min="5" max="40" value="${s.iy}" data-key="iy" data-range="1"><span style="font-family:JetBrains Mono;font-size:15px;font-weight:600;color:var(--gold);min-width:42px;text-align:right">${s.iy} yr</span></div></div></div>`;

    // Growth chart as bars
    const pts=[];for(let y=0;y<=s.iy;y+=Math.max(1,Math.floor(s.iy/10))){const m=y*12,co=s.ms*m,tot=r2>0?s.ms*((Math.pow(1+r2,m)-1)/r2):co;pts.push({name:"Yr "+y,a:Math.round(tot),b:Math.round(co)})}
    html+=`<div class="card"><div class="section-label"><h3>📈 Compound Growth</h3><p>Gold = total value, Blue = your contributions.</p></div>${barChart(pts,pts[pts.length-1]?.a||1)}</div>`;

    const habits=[{e:"🍕",l:"Food delivery",m:150},{e:"☕",l:"Daily coffee",m:120},{e:"👗",l:"Impulse shopping",m:200},{e:"📺",l:"Streaming subs",m:65},{e:"🚗",l:"Ride-shares",m:180},{e:"🍷",l:"Bars & nightlife",m:250}].map(h=>({...h,f:Math.round(h.m*mult)}));
    const maxF=Math.max(...habits.map(h=>h.f));

    html+=`<div class="card glow"><div class="section-label"><h3>🔥 What You're Actually Buying</h3><p>The true cost of monthly habits — invested at ${pct(s.ir)} over ${s.iy} years.</p></div>${habits.map(h=>`<div class="habit-row"><span class="emoji">${h.e}</span><div class="info"><div class="top"><span class="name">${h.l}</span><span class="cost">${fmt(h.m)}/mo</span></div><div class="progress"><div class="fill" style="width:${Math.min(100,(h.f/maxF)*100)}%"></div></div></div><div class="future"><div class="val">${fmt(h.f)}</div><div class="yr">in ${s.iy} years</div></div></div>`).join("")}<div class="gold-tip">💡 <strong>The reframe:</strong> That ${fmt(habits[0].m)}/mo food delivery habit isn't costing you ${fmt(habits[0].m)}. It's costing you <strong>${fmt(habits[0].f)}</strong> in future wealth.</div></div>`;

    html+=`<div class="reframe"><span style="font-size:30px;margin-top:2px">💡</span><div><h3>The Conversation Reframe</h3><p>The argument was never about who pays for DoorDash. It's about whether you'd rather have a few extra takeout meals this month — or <strong style="color:var(--gold)">${fmt(c2.fv)}</strong> in ${s.iy} years. When couples see the future value of daily spending drama, the "who pays" fight transforms into a "let's build this together" conversation.</p></div></div>`;
  }

  $("#content").innerHTML=html;
  bindEvents();
}

function bindEvents(){
  $$("[data-key]").forEach(el=>{
    const k=el.dataset.key;
    if(el.dataset.range){
      el.addEventListener("input",()=>{state[k]=parseInt(el.value);render()});
    }else if(el.dataset.name){
      el.addEventListener("input",()=>{state[k]=el.value;});
      el.addEventListener("blur",()=>render());
    }else if(el.dataset.pct){
      el.addEventListener("focus",()=>{el.value=(state[k]*100).toString()});
      el.addEventListener("blur",()=>{const v=parseFloat(el.value);if(!isNaN(v)){state[k]=v/100}render()});
    }else{
      el.addEventListener("focus",()=>{el.value=state[k].toString()});
      el.addEventListener("blur",()=>{const v=parseFloat(el.value.replace(/,/g,""));if(!isNaN(v)){state[k]=v}render()});
    }
  });
  $$("[data-model]").forEach(el=>{
    el.addEventListener("click",()=>{model=el.dataset.model;render()});
  });
}

$$(".tabs button").forEach(btn=>{
  btn.addEventListener("click",()=>{
    tab=btn.dataset.tab;
    $$(".tabs button").forEach(b=>b.classList.remove("active"));
    btn.classList.add("active");
    render();
  });
});

render();
</script>
</body>
</html>
