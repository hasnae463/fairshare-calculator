<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>The Fair Share Calculator™</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600;700&family=Outfit:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{overflow-x:hidden;background:#111110;width:100%;font-family:'Outfit',sans-serif;color:#F0EDE5;-webkit-font-smoothing:antialiased;line-height:1.5}
input[type=text],input[type=number]{background:#1E1E1C;border:1.5px solid #333330;border-radius:7px;color:#F0EDE5;font-family:'JetBrains Mono';font-size:clamp(12px,3vw,14px);font-weight:500;padding:8px 8px 8px 20px;outline:none;width:100%;box-sizing:border-box;transition:border-color .2s}
input:focus{border-color:#C9A84C}
input[type=range]{-webkit-appearance:none;height:4px;background:#333330;border-radius:2px;outline:none;cursor:pointer;width:100%}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:18px;height:18px;border-radius:50%;background:#C9A84C;cursor:pointer}
.w{max-width:800px;margin:0 auto;padding:0 clamp(8px,3vw,24px);width:100%}
.card{background:#1E1E1C;border:1px solid #333330;border-radius:clamp(10px,2vw,14px);padding:clamp(14px,3vw,24px);margin-bottom:clamp(10px,2vw,16px);overflow:hidden}
.card.gl{border-color:#8B7535;box-shadow:inset 0 0 16px rgba(201,168,76,0.1)}
.sec{margin-bottom:clamp(12px,2vw,18px)}
.sec h3{font-family:'Playfair Display';font-size:clamp(16px,4vw,20px);font-weight:500;display:flex;align-items:center;gap:8px}
.sec p{font-size:clamp(11px,2.5vw,13px);color:#706C60;margin-top:3px;margin-left:26px}
.pair{display:flex;gap:clamp(6px,2vw,10px);margin-bottom:6px}
.pair>*{flex:1;min-width:0}
.lbl{font-size:clamp(12px,2.8vw,14px);color:#A09C90;margin-bottom:5px}
.hint{font-size:clamp(10px,2.2vw,11px);color:#706C60;display:block}
.dv{height:1px;background:#2A2A27;margin:5px 0}
.tot{display:flex;justify-content:space-between;align-items:center;padding-top:10px;border-top:2px solid #333330;margin-top:8px;flex-wrap:wrap;gap:6px}
.plbl{display:flex;gap:clamp(6px,2vw,10px);margin-bottom:8px}
.plbl>:first-child{flex:1}
.plbl>span{flex:1;text-align:center;font-size:clamp(10px,2.5vw,12px);font-weight:600}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:clamp(8px,2vw,12px)}
.tog{display:flex;gap:3px;background:#181816;border-radius:10px;padding:3px;border:1px solid #333330}
.tog button{flex:1;padding:clamp(7px,2vw,10px) 4px;border-radius:8px;border:1px solid transparent;cursor:pointer;background:transparent;color:#706C60;font-family:'Outfit';font-size:clamp(10px,2.5vw,12px);display:flex;align-items:center;justify-content:center;gap:3px;transition:all .2s}
.cta{width:100%;padding:clamp(12px,3vw,16px);border:none;border-radius:10px;cursor:pointer;background:linear-gradient(135deg,#C9A84C,#8B7535);color:#111110;font-family:'Outfit';font-size:clamp(14px,3.5vw,16px);font-weight:600;margin-bottom:16px}
.hero{background:linear-gradient(160deg,#1A1A18,#252520 40%,#1E1D18);border-radius:clamp(10px,2vw,14px);padding:clamp(20px,5vw,36px) clamp(14px,3vw,28px);text-align:center;border:1px solid #8B7535;position:relative;overflow:hidden;margin-bottom:clamp(10px,2vw,16px)}
.hero::before{content:'';position:absolute;inset:0;background:radial-gradient(ellipse at 50% 0%,rgba(201,168,76,0.1),transparent 70%);pointer-events:none}
.hero .big{font-family:'Playfair Display';font-size:clamp(30px,10vw,56px);color:#C9A84C;letter-spacing:-1px;position:relative;line-height:1.1;text-shadow:0 0 30px rgba(201,168,76,0.25)}
.hab{display:flex;align-items:center;gap:clamp(8px,2vw,12px);padding:clamp(10px,2vw,13px);background:#181816;border-radius:8px;border:1px solid #2A2A27;margin-bottom:6px}
.hab .bar{height:4px;background:#333330;border-radius:2px;overflow:hidden;margin-top:5px}
.hab .fill{height:100%;border-radius:2px;background:linear-gradient(90deg,#8B7535,#C9A84C);transition:width .8s ease}
.rfr{background:linear-gradient(135deg,#1E1E1C,#1A1916);border-radius:12px;padding:clamp(16px,4vw,24px);border:1px solid #8B7535;display:flex;gap:clamp(10px,2vw,16px);align-items:flex-start;margin-bottom:clamp(10px,2vw,16px)}
.gtip{padding:clamp(10px,2vw,14px);background:rgba(201,168,76,0.08);border-radius:8px;border:1px solid rgba(201,168,76,0.15);font-size:clamp(11px,2.5vw,13px);color:#C9A84C;line-height:1.6;margin-top:10px}
.mono{font-family:'JetBrains Mono';font-weight:600}
.tabs{border-bottom:1px solid #333330;background:#1E1E1C;position:sticky;top:0;z-index:10}
.tabs .w{display:flex}
.tabs button{flex:1;padding:clamp(8px,2.5vw,13px) 2px;border:none;cursor:pointer;background:transparent;font-family:'Outfit';font-size:clamp(11px,2.8vw,14px);color:#706C60;border-bottom:2px solid transparent;display:flex;align-items:center;justify-content:center;gap:4px;text-align:center}
.tabs button.on{color:#C9A84C;border-bottom-color:#C9A84C;font-weight:600}
.hidden{display:none}
</style>
</head>
<body>

<!-- HEADER -->
<div style="border-bottom:1px solid #333330;background:#1E1E1C;padding:clamp(10px,3vw,18px) 0">
<div class="w" style="display:flex;align-items:center;justify-content:space-between;gap:8px">
  <div style="display:flex;align-items:center;gap:8px;min-width:0;flex:1">
    <div style="width:clamp(28px,7vw,36px);height:clamp(28px,7vw,36px);border-radius:8px;background:linear-gradient(135deg,#C9A84C,#8B7535);display:flex;align-items:center;justify-content:center;flex-shrink:0"><span style="font-size:clamp(13px,3.5vw,18px)">⚖️</span></div>
    <div style="min-width:0"><h1 style="font-family:'Playfair Display';font-size:clamp(15px,4.2vw,24px);color:#F5F0E3;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">The Fair Share Calculator</h1><p style="font-size:clamp(10px,2.5vw,13px);color:#706C60">Three fairness models. One honest conversation.</p></div>
  </div>
  <div style="padding:clamp(3px,1vw,6px) clamp(8px,2vw,14px);background:rgba(201,168,76,0.08);border-radius:14px;border:1px solid #8B7535;font-size:clamp(8px,2vw,11px);color:#C9A84C;font-weight:700;letter-spacing:1px;text-transform:uppercase;white-space:nowrap;flex-shrink:0">CFA® L3</div>
</div>
</div>

<!-- TABS -->
<div class="tabs"><div class="w">
  <button class="on" onclick="go('input')">📋 Data Entry</button>
  <button onclick="go('dashboard')">📊 Dashboard</button>
  <button onclick="go('wealth')">🚀 Wealth</button>
</div></div>

<!-- CONTENT -->
<div class="w" style="padding-top:clamp(12px,3vw,24px);padding-bottom:60px" id="content"></div>

<!-- FOOTER -->
<div style="border-top:1px solid #333330;padding:clamp(10px,3vw,16px);text-align:center;background:#1E1E1C">
  <p style="font-size:11px;color:#706C60">The Fair Share Calculator™ — CFA® Level III Candidate</p>
  <p style="font-size:10px;color:#706C60;opacity:.6;margin-top:3px">For educational purposes only. CFA® is a registered trademark of CFA Institute.</p>
</div>

<script>
const S={pA:"Partner A",pB:"Partner B",sA:120000,sB:65000,bA:15000,bB:5000,siA:0,siB:0,dA:450,dB:280,dA2:350,dB2:75,rent:2800,util:350,groc:800,ins:600,trans:400,din:500,subs:150,sav:500,oth:200,tA:.30,tB:.22,ir:.07,iy:20,ms:200};
let tab="input",mdl="proportional";
const $=s=>document.querySelector(s);
const fmt=n=>(n==null||isNaN(n))?"$0":n<0?"-$"+Math.abs(Math.round(n)).toLocaleString():"$"+Math.round(n).toLocaleString();
const pct=n=>(n*100).toFixed(1)+"%";

function calc(){
  const s=S,gA=s.sA+s.bA+s.siA,gB=s.sB+s.bB+s.siB,nA=gA*(1-s.tA),nB=gB*(1-s.tB),tN=nA+nB;
  const mdA=s.dA+s.dA2,mdB=s.dB+s.dB2,dA=nA-mdA*12,dB=nB-mdB*12;
  const mE=s.rent+s.util+s.groc+s.ins+s.trans+s.din+s.subs+s.sav+s.oth;
  const pA=tN>0?nA/tN:.5,pmA=mE*pA,pmB=mE*(1-pA);
  const fun=(tN/12-mE)/2,amA=nA/12-fun,amB=nB/12-fun;
  const aA=Math.max(0,nA-mdA*12),aB=Math.max(0,nB-mdB*12),aT=aA+aB;
  const dsA=aT>0?aA/aT:.5,dmA=mE*dsA,dmB=mE*(1-dsA);
  const r=s.ir/12,n=s.iy*12,fv=s.ms*((Math.pow(1+r,n)-1)/(r||.001)),tc=s.ms*n;
  return{gA,gB,nA,nB,tN,mdA,mdB,dA,dB,mE,pA,pmA,pmB,fun,amA,amB,dsA,dmA,dmB,fv,tc};
}

function getAR(c){
  if(mdl==="proportional")return{sA:c.pA,sB:1-c.pA,mA:c.pmA,mB:c.pmB,rA:c.nA/12-c.pmA,rB:c.nB/12-c.pmB};
  if(mdl==="allowance")return{sA:c.mE>0?c.amA/c.mE:.5,sB:c.mE>0?c.amB/c.mE:.5,mA:c.amA,mB:c.amB,rA:c.fun,rB:c.fun};
  return{sA:c.dsA,sB:1-c.dsA,mA:c.dmA,mB:c.dmB,rA:c.nA/12-c.mdA-c.dmA,rB:c.nB/12-c.mdB-c.dmB};
}

function ci(key,v){return`<div style="position:relative;width:100%"><span style="position:absolute;left:8px;top:50%;transform:translateY(-50%);color:#706C60;font-size:11px;font-family:JetBrains Mono;pointer-events:none">$</span><input type="text" inputmode="numeric" data-k="${key}" value="${Math.round(v).toLocaleString()}" style="padding-left:20px"></div>`}
function pi(key,v){return`<div style="position:relative;width:100%"><input type="text" inputmode="decimal" data-k="${key}" data-pct="1" value="${(v*100).toFixed(1)}" style="text-align:right;padding-right:22px;padding-left:8px"><span style="position:absolute;right:8px;top:50%;transform:translateY(-50%);color:#706C60;font-size:11px;font-family:JetBrains Mono;pointer-events:none">%</span></div>`}

function donut(sA,sB,sz){
  sz=sz||140;const r=sz/2-10,cx=sz/2,cy=sz/2,c=2*Math.PI*r;
  const a=Math.max(.01,Math.min(.99,sA)),d1=c*a,d2=c*(1-a);
  return`<svg width="${sz}" height="${sz}" viewBox="0 0 ${sz} ${sz}"><circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="#C9A84C" stroke-width="14" stroke-dasharray="${d1-3} ${c}" stroke-dashoffset="${c/4}" stroke-linecap="round"/><circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="#6B9BD2" stroke-width="14" stroke-dasharray="${d2-3} ${c}" stroke-dashoffset="${c/4-d1}" stroke-linecap="round"/></svg>`;
}

function bars(data,maxV,h){
  h=h||160;if(!maxV)maxV=Math.max(...data.flatMap(d=>[d.a,d.b]),1);
  return`<div style="margin:8px 0"><div style="display:flex;align-items:flex-end;gap:clamp(4px,2vw,8px);height:${h}px;padding:0 4px">${data.map(d=>{
    const hA=Math.max(3,(d.a/maxV)*h),hB=Math.max(3,(d.b/maxV)*h);
    return`<div style="flex:1;text-align:center"><div style="display:flex;gap:3px;align-items:flex-end;justify-content:center;height:${h}px"><div><div class="mono" style="font-size:clamp(9px,2.2vw,11px);color:#C9A84C;margin-bottom:2px">${fmt(d.a)}</div><div style="height:${hA}px;width:clamp(18px,5vw,32px);background:#C9A84C;border-radius:4px 4px 0 0"></div></div><div><div class="mono" style="font-size:clamp(9px,2.2vw,11px);color:#6B9BD2;margin-bottom:2px">${fmt(d.b)}</div><div style="height:${hB}px;width:clamp(18px,5vw,32px);background:#6B9BD2;border-radius:4px 4px 0 0"></div></div></div><div style="font-size:clamp(9px,2.2vw,11px);color:#706C60;margin-top:4px">${d.name}</div></div>`}).join("")}</div><div style="display:flex;gap:16px;justify-content:center;margin-top:8px"><span style="display:flex;align-items:center;gap:5px;font-size:11px;color:#A09C90"><span style="width:10px;height:10px;border-radius:2px;background:#C9A84C;display:inline-block"></span>${S.pA}</span><span style="display:flex;align-items:center;gap:5px;font-size:11px;color:#A09C90"><span style="width:10px;height:10px;border-radius:2px;background:#6B9BD2;display:inline-block"></span>${S.pB}</span></div></div>`;
}

function render(){
  const c=calc(),ar=getAR(c),s=S;
  let h="";

  if(tab==="input"){
    h+=`<div class="card"><div class="sec"><h3>👥 Partners</h3><p>Names personalize the numbers.</p></div><div class="pair"><input type="text" data-k="pA" data-name="1" value="${s.pA}" style="color:#C9A84C;font-family:Outfit;font-weight:500;font-size:clamp(13px,3.2vw,15px);padding:9px 10px"><input type="text" data-k="pB" data-name="1" value="${s.pB}" style="color:#6B9BD2;font-family:Outfit;font-weight:500;font-size:clamp(13px,3.2vw,15px);padding:9px 10px"></div></div>`;

    h+=`<div class="card"><div class="sec"><h3>💰 Annual Income</h3><p>Gross before taxes.</p></div><div class="plbl"><div></div><span style="color:#C9A84C">${s.pA}</span><span style="color:#6B9BD2">${s.pB}</span></div>`;
    [["Salary","sA","sB"],["Bonus","bA","bB"],["Side Hustle","siA","siB"]].forEach(([l,a,b])=>{
      h+=`<div class="lbl">${l}</div><div class="pair">${ci(a,s[a])}${ci(b,s[b])}</div><div class="dv"></div>`;
    });
    h+=`<div class="tot"><span style="font-weight:600;font-size:clamp(12px,3vw,14px)">Total Gross</span><div style="display:flex;gap:clamp(6px,2vw,12px)"><span class="mono" style="font-size:clamp(13px,3vw,15px);color:#C9A84C">${fmt(c.gA)}</span><span class="mono" style="font-size:clamp(13px,3vw,15px);color:#6B9BD2">${fmt(c.gB)}</span></div></div></div>`;

    h+=`<div class="card"><div class="sec"><h3>🏛️ Tax Rates</h3><p>Federal + State + FICA combined.</p></div><div class="plbl"><div></div><span style="color:#C9A84C">${s.pA}</span><span style="color:#6B9BD2">${s.pB}</span></div><div class="lbl">All-in Effective Rate<span class="hint">Federal + State + FICA</span></div><div class="pair">${pi("tA",s.tA)}${pi("tB",s.tB)}</div><div class="tot"><span style="font-weight:600;font-size:clamp(12px,3vw,14px)">After-Tax</span><div style="display:flex;gap:clamp(6px,2vw,12px)"><span class="mono" style="font-size:clamp(13px,3vw,15px);color:#5BAD78">${fmt(c.nA)}</span><span class="mono" style="font-size:clamp(13px,3vw,15px);color:#5BAD78">${fmt(c.nB)}</span></div></div></div>`;

    h+=`<div class="card"><div class="sec"><h3>⚡ Individual Debts</h3><p>Monthly solo obligations.</p></div><div class="plbl"><div></div><span style="color:#C9A84C">${s.pA}</span><span style="color:#6B9BD2">${s.pB}</span></div>`;
    [["Student Loans","dA","dB"],["Car / Credit","dA2","dB2"]].forEach(([l,a,b])=>{
      h+=`<div class="lbl">${l}</div><div class="pair">${ci(a,s[a])}${ci(b,s[b])}</div><div class="dv"></div>`;
    });
    h+=`</div>`;

    h+=`<div class="card"><div class="sec"><h3>🏠 Joint Expenses</h3><p>Monthly shared costs.</p></div>`;
    [["Rent","rent"],["Utilities","util"],["Groceries","groc"],["Insurance","ins"],["Transport","trans"],["Dining","din"],["Subscriptions","subs"],["Savings","sav"],["Other","oth"]].forEach(([l,k])=>{
      h+=`<div class="lbl">${l}</div>${ci(k,s[k])}<div class="dv"></div>`;
    });
    h+=`<div class="tot"><span style="font-weight:600">Total Monthly</span><span class="mono" style="font-size:clamp(16px,4vw,20px);color:#C9A84C">${fmt(c.mE)}<span style="font-size:11px;color:#706C60;font-weight:400">/mo</span></span></div></div>`;

    h+=`<button class="cta" onclick="go('dashboard')">See Your Results →</button>`;
  }

  if(tab==="dashboard"){
    const mc={proportional:{c:"#5BAD78",bg:"rgba(91,173,120,0.08)",bd:"rgba(91,173,120,0.2)"},allowance:{c:"#6B9BD2",bg:"rgba(107,155,210,0.08)",bd:"rgba(107,155,210,0.2)"},debtAdjusted:{c:"#D4956A",bg:"rgba(212,149,106,0.08)",bd:"rgba(212,149,106,0.2)"}};
    const m=mc[mdl];
    const mls={proportional:"Proportional",allowance:"Equal Allowance",debtAdjusted:"Debt-Adjusted"};
    const descs={proportional:"<b>Proportional:</b> Each contributes based on after-tax income share.",allowance:"<b>Equal Allowance:</b> Both end up with identical personal spending money.",debtAdjusted:"<b>Debt-Adjusted:</b> Subtracts debts before calculating shares."};

    h+=`<div class="card gl"><div class="sec"><h3>🔀 Fairness Model</h3><p>Toggle to compare.</p></div><div class="tog">${[["proportional","⚖️","Proportional"],["allowance","🎯","Equal Allow."],["debtAdjusted","🛡️","Debt-Adj."]].map(([k,ic,l])=>`<button onclick="mdl='${k}';render()" style="${mdl===k?`background:${mc[k].bg};border-color:${mc[k].bd};color:${mc[k].c};font-weight:600`:''}">${ic} ${l}</button>`).join("")}</div><div style="margin-top:10px;padding:clamp(8px,2vw,14px);background:${m.bg};border-radius:8px;border:1px solid ${m.bd};font-size:clamp(12px,2.8vw,14px);color:${m.c};line-height:1.6">${descs[mdl]}</div></div>`;

    h+=`<div class="g2">${[[s.pA,fmt(ar.mA)+"/mo",pct(ar.sA),"#C9A84C"],[s.pB,fmt(ar.mB)+"/mo",pct(ar.sB),"#6B9BD2"]].map(([n,v,sub,clr])=>`<div style="padding:clamp(10px,2.5vw,16px);background:#1E1E1C;border-radius:10px;border:1px solid #333330;border-left:3px solid ${clr};margin-bottom:clamp(10px,2vw,16px)"><div style="font-size:clamp(9px,2.2vw,11px);color:#706C60;text-transform:uppercase;letter-spacing:.8px;margin-bottom:5px">✦ ${n} pays</div><div class="mono" style="font-size:clamp(15px,4vw,20px);color:${clr}">${v}</div><div style="font-size:clamp(10px,2.3vw,12px);color:#706C60;margin-top:3px">${sub} of expenses</div></div>`).join("")}</div>`;

    h+=`<div class="card"><div class="sec"><h3>💰 Pocket Money</h3></div><div class="g2">${[[s.pA,ar.rA,"#C9A84C"],[s.pB,ar.rB,"#6B9BD2"]].map(([n,v,clr])=>`<div style="padding:clamp(12px,3vw,18px);background:${v>=0?"rgba(91,173,120,0.1)":"rgba(212,113,106,0.1)"};border-radius:10px;text-align:center;border:1px solid ${v>=0?"rgba(91,173,120,0.2)":"rgba(212,113,106,0.2)"}"><div style="font-size:12px;color:${clr};font-weight:600;margin-bottom:5px">${n}</div><div class="mono" style="font-size:clamp(18px,5vw,26px);color:${v>=0?"#5BAD78":"#D4716A"}">${fmt(v)}</div><div style="font-size:11px;color:#706C60;margin-top:3px">per month</div></div>`).join("")}</div></div>`;

    h+=`<div class="card"><div class="sec"><h3>🍩 Split</h3></div><div style="text-align:center">${donut(ar.sA,ar.sB)}</div><div style="display:flex;gap:clamp(10px,3vw,20px);flex-wrap:wrap;justify-content:center;margin-top:8px">${[[s.pA,pct(ar.sA),"#C9A84C"],[s.pB,pct(ar.sB),"#6B9BD2"]].map(([n,sh,clr])=>`<span style="display:flex;align-items:center;gap:5px"><span style="width:10px;height:10px;border-radius:2px;background:${clr};display:inline-block"></span><span style="font-size:12px;color:#A09C90">${n}</span><span class="mono" style="font-size:13px;color:${clr}">${sh}</span></span>`).join("")}</div></div>`;

    h+=`<div class="card"><div class="sec"><h3>📊 All Models</h3></div>${bars([{name:"Prop.",a:c.pmA,b:c.pmB},{name:"Equal",a:c.amA,b:c.amB},{name:"Debt",a:c.dmA,b:c.dmB}])}</div>`;

    const pain=[{l:"Proportional",c:"#5BAD78",bg:"rgba(91,173,120,0.08)",bd:"rgba(91,173,120,0.2)",pA:c.dA>0?(c.pmA*12)/c.dA:0,pB:c.dB>0?(c.pmB*12)/c.dB:0},{l:"Equal Allowance",c:"#6B9BD2",bg:"rgba(107,155,210,0.08)",bd:"rgba(107,155,210,0.2)",pA:c.dA>0?(c.amA*12)/c.dA:0,pB:c.dB>0?(c.amB*12)/c.dB:0},{l:"Debt-Adjusted",c:"#D4956A",bg:"rgba(212,149,106,0.08)",bd:"rgba(212,149,106,0.2)",pA:c.dA>0?(c.dmA*12)/c.dA:0,pB:c.dB>0?(c.dmB*12)/c.dB:0}];
    h+=`<div class="card"><div class="sec"><h3>🌡️ Pain Index</h3><p>% of disposable to shared costs.</p></div>${pain.map(m=>`<div style="padding:clamp(8px,2vw,12px);background:${m.bg};border-radius:8px;border:1px solid ${m.bd};margin-bottom:8px"><div style="font-size:12px;font-weight:600;color:${m.c};margin-bottom:8px;text-align:center">${m.l}</div><div style="display:flex;justify-content:space-around">${[[s.pA,m.pA],[s.pB,m.pB]].map(([n,v])=>`<div style="text-align:center"><div style="font-size:11px;color:#706C60">${n}</div><div class="mono" style="font-size:clamp(14px,3.5vw,18px);color:${m.c};margin-top:2px">${pct(v)}</div></div>`).join("")}</div><div style="font-size:11px;color:#706C60;margin-top:8px;padding-top:8px;border-top:1px solid ${m.bd};text-align:center">Spread: <strong style="color:${Math.abs(m.pA-m.pB)>.2?"#D4716A":"#5BAD78"}">${pct(Math.abs(m.pA-m.pB))}</strong></div></div>`).join("")}</div>`;
  }

  if(tab==="wealth"){
    const r=s.ir/12,n=s.iy*12,mul=r>0?(Math.pow(1+r,n)-1)/r:n;
    const habits=[{e:"🍕",l:"Food delivery",m:150},{e:"☕",l:"Daily coffee",m:120},{e:"👗",l:"Impulse shopping",m:200},{e:"📺",l:"Streaming subs",m:65},{e:"🚗",l:"Ride-shares",m:180},{e:"🍷",l:"Bars & nightlife",m:250}].map(i=>({...i,f:Math.round(i.m*mul)}));
    const maxF=Math.max(...habits.map(i=>i.f));

    h+=`<div class="hero"><p style="font-size:clamp(11px,2.8vw,15px);color:#706C60;margin-bottom:8px;position:relative">Invest <b style="color:#C9A84C">${fmt(s.ms)}/mo</b> at ${pct(s.ir)} for ${s.iy}yr</p><div class="big">${fmt(c.fv)}</div><div style="display:flex;justify-content:center;gap:clamp(16px,5vw,36px);margin-top:12px;position:relative;flex-wrap:wrap"><div><div style="font-size:clamp(9px,2vw,11px);color:#706C60;text-transform:uppercase;letter-spacing:1px">You put in</div><div class="mono" style="font-size:clamp(14px,3.5vw,18px);color:#6B9BD2;margin-top:2px">${fmt(c.tc)}</div></div><div style="width:1px;background:#333330"></div><div><div style="font-size:clamp(9px,2vw,11px);color:#706C60;text-transform:uppercase;letter-spacing:1px">Market gives</div><div class="mono" style="font-size:clamp(14px,3.5vw,18px);color:#5BAD78;margin-top:2px">${fmt(c.fv-c.tc)}</div></div></div></div>`;

    h+=`<div class="card"><div class="sec"><h3>⚙️ Adjust Scenario</h3></div><div class="lbl">Monthly Savings<span class="hint">Redirect from spending drama</span></div>${ci("ms",s.ms)}<div class="dv"></div><div class="lbl">Annual Return<span class="hint">S&P ≈ 10% · Conservative ≈ 7%</span></div>${pi("ir",s.ir)}<div class="dv"></div><div class="lbl" style="margin-bottom:6px">Time Horizon</div><div style="display:flex;align-items:center;gap:10px"><input type="range" min="5" max="40" value="${s.iy}" data-k="iy" data-range="1"><span class="mono" style="font-size:14px;color:#C9A84C;white-space:nowrap">${s.iy}yr</span></div></div>`;

    // Growth bars
    const pts=[];for(let y=0;y<=s.iy;y+=Math.max(1,Math.floor(s.iy/8))){const m=y*12,co=s.ms*m,tot=r>0?s.ms*((Math.pow(1+r,m)-1)/r):co;pts.push({name:"Yr"+y,a:Math.round(tot),b:Math.round(co)})}
    h+=`<div class="card"><div class="sec"><h3>📈 Growth</h3><p>Gold = total, Blue = contributions.</p></div>${bars(pts,pts[pts.length-1]?.a||1)}</div>`;

    h+=`<div class="card gl"><div class="sec"><h3>🔥 What You're Actually Buying</h3><p>Habits invested at ${pct(s.ir)} over ${s.iy}yr.</p></div>${habits.map(i=>`<div class="hab"><span style="font-size:clamp(16px,4vw,22px);flex-shrink:0">${i.e}</span><div style="flex:1;min-width:0"><div style="display:flex;justify-content:space-between;margin-bottom:3px"><span style="font-size:clamp(11px,2.8vw,13px);color:#A09C90">${i.l}</span><span class="mono" style="font-size:clamp(10px,2.2vw,11px);color:#706C60">${fmt(i.m)}/mo</span></div><div class="bar"><div class="fill" style="width:${Math.min(100,(i.f/maxF)*100)}%"></div></div></div><div style="text-align:right;flex-shrink:0"><div class="mono" style="font-size:clamp(13px,3.2vw,16px);color:#C9A84C">${fmt(i.f)}</div><div style="font-size:9px;color:#706C60">in ${s.iy}yr</div></div></div>`).join("")}<div class="gtip">💡 <b>Reframe:</b> That ${fmt(habits[0].m)}/mo food delivery isn't costing ${fmt(habits[0].m)}. It's costing <b>${fmt(habits[0].f)}</b> in future wealth.</div></div>`;

    h+=`<div class="rfr"><span style="font-size:clamp(22px,6vw,30px);flex-shrink:0">💡</span><div><h3 style="font-family:'Playfair Display';font-size:clamp(14px,3.5vw,18px);color:#F5F0E3;margin-bottom:6px">The Conversation Reframe</h3><p style="font-size:clamp(12px,2.8vw,14px);color:#A09C90;line-height:1.7">It was never about who pays for DoorDash. It's about takeout this month — or <b style="color:#C9A84C">${fmt(c.fv)}</b> in ${s.iy} years.</p></div></div>`;
  }

  $("#content").innerHTML=h;
  bind();
}

function bind(){
  document.querySelectorAll("[data-k]").forEach(el=>{
    const k=el.dataset.k;
    if(el.dataset.range){
      el.addEventListener("input",()=>{S[k]=parseInt(el.value);render()});
    }else if(el.dataset.name){
      el.addEventListener("input",()=>{S[k]=el.value});
      el.addEventListener("blur",()=>render());
    }else if(el.dataset.pct){
      el.addEventListener("focus",()=>{el.value=(S[k]*100).toString()});
      el.addEventListener("blur",()=>{const v=parseFloat(el.value);if(!isNaN(v))S[k]=v/100;render()});
    }else{
      el.addEventListener("focus",()=>{el.value=S[k].toString()});
      el.addEventListener("blur",()=>{const v=parseFloat(el.value.replace(/,/g,""));if(!isNaN(v))S[k]=v;render()});
    }
  });
}

function go(t){
  tab=t;render();
  document.querySelectorAll(".tabs button").forEach((b,i)=>{
    b.className=["input","dashboard","wealth"][i]===t?"on":"";
  });
}

render();
</script>
</body>
</html>
